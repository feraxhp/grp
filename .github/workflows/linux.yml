on:
  workflow_dispatch:
    inputs:
      binary:
        description: 'Name of the generated binary'
        required: true
        type: string
      path:
        description: 'Path to the project root (where Cargo.toml is)'
        required: false
        default: '.'
        type: string
      deps_x86_64:
        description: 'Dependencias APT para x86_64 (ej: libssl-dev)'
        required: false
        default: ''
        type: string
      deps_aarch64:
        description: 'Dependencias APT para aarch64 (ej: libssl-dev:arm64)'
        required: false
        default: ''
        type: string
      deps_armv7:
        description: 'Dependencias APT para armv7 (ej: libssl-dev:armhf)'
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: x86_64
            linker: ""
          - target: aarch64-unknown-linux-gnu
            name: aarch64
            linker: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            name: armv7
            linker: gcc-arm-linux-gnueabihf

    defaults:
      run:
        working-directory: ${{ inputs.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}

      - name: Configurar repositorios para Multi-Arch
        run: |
          # 1. Hacer que las fuentes actuales solo busquen amd64
          sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i 's/deb https/deb [arch=amd64] https/g' /etc/apt/sources.list

          # 2. Añadir el servidor de ports para arm64 y armhf
          # Usamos "noble" porque es la versión que indica tu error (Ubuntu 24.04)
          OS_CODENAME=$(lsb_release -sc)
          echo "deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports $OS_CODENAME main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm-ports.list
          echo "deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${OS_CODENAME}-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm-ports.list
          echo "deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports ${OS_CODENAME}-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm-ports.list

      - name: Install cross-compilation tools
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}

      - name: Instalar dependencias del sistema por arquitectura
        if: env.TARGET_DEPS != ''
        run: |
          # Habilitar la arquitectura en el gestor de paquetes
          if [ ! -z "$DPKG_ARCH" ]; then
            sudo dpkg --add-architecture $DPKG_ARCH
          fi
          
          # Ahora el update no fallará porque sabe dónde buscar cada arch
          sudo apt-get update
          sudo apt-get install -y ${{ env.TARGET_DEPS }}
  
      - name: Instalar dependencias del sistema por arquitectura
        if: env.TARGET_DEPS != ''
        run: |
          # Si estamos compilando para ARM, debemos decirle a apt que acepte esos paquetes
          if [ ! -z "$DPKG_ARCH" ]; then
            sudo dpkg --add-architecture $DPKG_ARCH
          fi
          
          sudo apt-get update
          sudo apt-get install -y ${{ env.TARGET_DEPS }}
      
      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build for ${{ matrix.name }}
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_SYSROOT_DIR: /

      - name: Generate DEB Package
        run: cargo deb --target ${{ matrix.target }} --no-build

      - name: Generate RPM Package
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Prepare Binary for upload
        run: |
          TARGET="target/${{ matrix.target }}/release"
          mv "$TARGET/${{ inputs.binary }}" "$TARGET/${{ inputs.binary }}-${{ matrix.name }}-v${{ env.version }}"

      # - name: Upload release assets
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: "v${{ env.version }}"
      #     files: |
      #       ${{ inputs.path }}/target/${{ matrix.target }}/debian/*.deb
      #       ${{ inputs.path }}/target/${{ matrix.target }}/generate-rpm/*.rpm
      #       ${{ inputs.path }}/target/${{ matrix.target }}/release/${{ inputs.binary }}-*
